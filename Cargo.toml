[package]
name = "hi-shell"
version = "0.2.1"
edition = "2024"
description = "An intelligent terminal assistant that translates natural language descriptions into executable shell commands."
license = "MIT"
repository = "https://github.com/tufantunc/hi-shell"
readme = "README.md"
keywords = ["cli", "llm", "shell", "assistant", "ai"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
anyhow = "1.0.83"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
toml = "0.8.13"
thiserror = "1.0.61"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
reqwest = { version = "0.12.4", features = ["json"] }
directories = "5.0.1"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
indicatif = "0.17.8"
chrono = { version = "0.4.38", features = ["serde"] }
atty = "0.2.14"
rustyline = "14.0.0"
colored = "2.1.0"
futures = "0.3.30"
uuid = { version = "1.8.0", features = ["v4"] }

# HF Hub and Candle for embedded models
hf-hub = "0.4.0"
candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
tokenizers = "0.21.0"
async-trait = "0.1.80"
once_cell = "1.19"
semver = "1.0"
